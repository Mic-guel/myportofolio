{% extends "base1.html" %}
{% block meta %}
    <title>Add Achievement - {{ name }}</title>
{% endblock meta %}
{% block content %}
    <main>
        <section class="experience-section">
            <div class="container">
                <h1 class="h1-a">Add A New Achievement</h1>
                <form method="post"
                      action="{% url 'main:create_achievement' %}"
                      class="form-a">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="form-group-a">
                            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}
                            {% for error in field.errors %}
                                <p class="form-error-a">{{ error }}</p>
                            {% endfor %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="button-a">Add Achievement</button>
                    <a href="{% url 'main:show_achievements' %}" class="button-a">Cancel</a>
                </form>
            </div>
        </section>
    </main>
{% endblock content %}
